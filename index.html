      function evaluateCompliance(input) {
        const country = TARGET_COUNTRIES.find(c => c.id === input.targetCountryId) || TARGET_COUNTRIES[0];
        const { yearRange, fuelType, emissionGrade, dpfStatus } = input;
        let score = 100;
        const keyReasons = [];
        const recommendations = [];

        const isGrade5 = emissionGrade === 5;
        const hasNoDpf = dpfStatus === 'stock_none' || dpfStatus === 'unverified';

        if (emissionGrade === 5) {
          score -= 60;
          keyReasons.push('국내 배출가스 5등급(노후경유차)으로 고농도 미세먼지 및 질소산화물 다량 배출 위험');
        } else if (emissionGrade === 4) {
          score -= 30;
          keyReasons.push('국내 배출가스 4등급 차량으로 주요 수입국 배출 규제 경계선에 위치');
        } else if (emissionGrade === 3) {
          score -= 10;
        }

        if (country.id === 'kenya_uganda') {
          if (yearRange === '2010_before' || yearRange === '2011_2015') {
            score -= 50;
            keyReasons.push('동아프리카공동체(EAC) 8년 연식 상한선 위반 (2018년 이전 제작 차량 통관 거부 위험)');
          }
          if (emissionGrade >= 4) {
            score -= 30;
            keyReasons.push('EAC EURO 4 배출 기준 미달 (4~5등급 차량 수입 불허 대상)');
          }
        } else if (country.id === 'chile') {
          if (emissionGrade >= 3 && fuelType === 'diesel') {
            score -= 40;
            keyReasons.push('칠레 남미 환경기준(EURO 5/6 준수 의무) 대비 디젤 배출가스 정화장치 부족 우려');
          }
          if (yearRange === '2010_before') {
            score -= 40;
            keyReasons.push('칠레 기술표준원(3TX) 노후 차량 안전·환경 인증 통과 불가');
          }
        } else if (country.id === 'mongolia') {
          if (fuelType === 'diesel' && hasNoDpf) {
            score -= 35;
            keyReasons.push('울란바토르 동절기 분진 집중 단속 대상 (DPF 미부착 경유차 매연 기준 초과)');
          }
        } else if (country.id === 'libya') {
          if (dpfStatus === 'unverified') {
            score -= 20;
            keyReasons.push('냉각계통 및 오일류, 안전 부품 정비 상태 미확인으로 사막 기후 고장 리스크 존재');
          }
        }

        if (fuelType === 'diesel') {
          if (dpfStatus === 'stock_none') {
            score -= 25;
            keyReasons.push('경유차량 필수 저감장치(DPF) 미장착 상태로 현지 대기질 직접 악화');
          } else if (dpfStatus === 'unverified') {
            score -= 20;
            keyReasons.push('배출가스 저감장치 및 주요 안전계통 검증 이력 부재');
          }
        }

        let status, statusTitle, statusTitleEn, summary, summaryEn;

        if (isGrade5 || score < 50 || (country.id === 'kenya_uganda' && yearRange === '2010_before')) {
          status = 'FAIL';
          statusTitle = '수출 부적합 (그린 덤핑 위험 경고)';
          statusTitleEn = 'High Risk of Green Dumping (Export Non-Compliant)';
          summary = `${country.name}의 환경·연식 규제 기준에 현저히 미달하며, 현지 대기오염 악화 및 통관 거부·반송 위험이 매우 높습니다. 조기 폐차 정부 지원금 신청 또는 국내 성능 복원 후 재심사가 요구됩니다.`;
          summaryEn = `Critically non-compliant with ${country.nameEn} environmental and age standards. High risk of customs rejection and carbon/pollution leakage.`;
          recommendations.push('국내 조기 폐차 보조금 대상 여부 확인 및 친환경 자원순환 처리 권고');
          recommendations.push('수출 강행 시 관세청 통관 거부 및 바이어 클레임 손실 위험');
          recommendations.push('DPF 공식 인증품 신규 장착 및 종합 성능검사 재진단 필수');
        } else if (score < 80 || (fuelType === 'diesel' && hasNoDpf) || emissionGrade === 4) {
          status = 'CONDITIONAL';
          statusTitle = '조건부 적합 (정비·저감조치 권고)';
          statusTitleEn = 'Conditional Clearance (Maintenance & Retrofit Advised)';
          summary = `목표 수입국 통관은 가능할 수 있으나, 배출가스 또는 주요 안전 부품의 노후화로 인해 현지 대기오염 및 안전 리스크가 잔존합니다. 선적 전 DPF 클리닝 및 안전 정비 후 인증서 발급을 강력 권장합니다.`;
          summaryEn = `Border clearance may be accepted, but vehicle poses moderate environmental and safety risks. DPF maintenance, brake, and tire overhaul strongly advised before export.`;
          recommendations.push('선적 전 공식 지정 정비소에서 DPF 차압 점검 및 필터 클리닝 완료');
          recommendations.push('브레이크 패드 마모도 및 브레이크액 비등점 검사로 안전성 보강');
          recommendations.push('현지 바이어에게 사전 정비 이력서(Green Maintenance Report) 첨부 제공');
        } else {
          status = 'PASS';
          statusTitle = '수출 적합 (Clear to Export)';
          statusTitleEn = 'Clear to Export (K-Certified Ready)';
          summary = `${country.name}의 최신 환경 배출 기준 및 안전 규제를 충족합니다. 바이어에게 투명한 신뢰를 제공하는 'ClearExport 디지털 그린 패스포트' 발급 대상입니다.`;
          summaryEn = `Fully compliant with ${country.nameEn} environmental and safety standards. Eligible for official ClearExport Digital Green Passport.`;
          recommendations.push('ClearExport 공인 디지털 그린 패스포트 발급 및 QR 검증 코드 생성');
          recommendations.push('선적 서류(B/L)에 ESG 환경 적합 인증서 번호 명기');
          recommendations.push('인천항 수출 야적장 안전 점검 완료 스티커 부착');
        }

        return {
          status, statusTitle, statusTitleEn, summary, summaryEn, country,
          score: Math.max(10, Math.min(100, score)),
          keyReasons, recommendations
        };
      }

              </div>

              <div id="printable-green-passport" class="p-6 sm:p-10 bg-white relative">
                <div class="text-center pb-6 border-b-2 border-emerald-800/20">
                  <div class="flex items-center justify-between mb-2">
                    <div class="text-left">
                      <span class="text-[10px] font-bold text-slate-400 uppercase block">REPUBLIC OF KOREA · EXPORT INTEGRITY</span>
                      <span class="text-xs font-bold text-emerald-800">K-USED CAR GREEN PASSPORT INITIATIVE</span>
                    </div>
                    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-100 border border-emerald-300 text-emerald-900 font-extrabold text-xs">
                      <i data-lucide="award" class="w-3.5 h-3.5 text-emerald-700"></i><span>CLEAREXPORT CERTIFIED</span>
                    </div>
                    <div class="text-right">
                      <span class="text-[10px] font-bold text-slate-400 uppercase block">CERTIFICATE NO.</span>
                      <span class="text-xs font-mono font-bold text-slate-900">${certNumber}</span>
                    </div>
                  </div>
                  <h1 class="text-2xl sm:text-3xl font-black text-slate-950 mt-3">디지털 그린 패스포트 (Green Passport)</h1>
                  <p class="text-xs sm:text-sm font-semibold text-emerald-700 tracking-widest uppercase mt-1">Used Vehicle Environmental & Safety Compliance Certificate</p>
                </div>

                <div class="grid sm:grid-cols-12 gap-6 my-6">
                  <div class="sm:col-span-7 space-y-4">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                      <div class="text-xs font-bold text-slate-400 uppercase mb-2">차량 기본 제원 (Vehicle Identification)</div>
                      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                        <div><span class="text-slate-400 block text-[11px]">차량명</span><span class="font-bold text-slate-900 text-sm">${vehicleName}</span></div>
                        <div><span class="text-slate-400 block text-[11px]">제작연식</span><span class="font-bold text-slate-900 text-sm">${year}년형</span></div>
                        <div><span class="text-slate-400 block text-[11px]">유종</span><span class="font-bold text-slate-900 text-sm">${fuelName}</span></div>
                        <div><span class="text-slate-400 block text-[11px]">차대번호</span><span class="font-mono font-bold text-slate-900 text-xs">${vin}</span></div>
                        <div><span class="text-slate-400 block text-[11px]">배출가스 등급</span><span class="font-black text-emerald-700 text-xs">${grade}등급</span></div>
                        <div><span class="text-slate-400 block text-[11px]">검사일자</span><span class="font-bold text-slate-800 text-xs">${inspectionDate}</span></div>
                      </div>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                      <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-bold text-slate-400 uppercase">배출가스 실측치 vs 수입국 허용기준</span>
                        <span class="text-[11px] font-semibold text-emerald-700">인천항 정밀측정 완료</span>
                      </div>
                      <div class="space-y-3 text-xs">
                        <div>
                          <div class="flex justify-between mb-1">
                            <span class="font-semibold text-slate-700">매연 / 미세입자 분진 (Smoke PM)</span>
                            <span class="font-bold">측정치 <strong class="${smokeVal <= 15 ? 'text-emerald-600' : 'text-rose-600'}">${smokeVal}%</strong> / 기준 15%</span>
                          </div>
                          <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                            <div class="h-full rounded-full ${smokeVal <= 15 ? 'bg-emerald-500' : 'bg-rose-500'}" style="width: ${Math.min(100, (smokeVal / 15) * 100)}%"></div>
                          </div>
                        </div>
                        <div>
                          <div class="flex justify-between mb-1">
                            <span class="font-semibold text-slate-700">질소산화물 (NOx Index)</span>
                            <span class="font-bold">측정치 <strong class="${noxVal <= 0.45 ? 'text-emerald-600' : 'text-rose-600'}">${noxVal} g/km</strong> / 기준 0.45 g/km</span>
                          </div>
                          <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                            <div class="h-full rounded-full ${noxVal <= 0.45 ? 'bg-emerald-500' : 'bg-rose-500'}" style="width: ${Math.min(100, (noxVal / 0.45) * 100)}%"></div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="sm:col-span-5 bg-gradient-to-b from-slate-900 to-emerald-950 text-white p-5 rounded-2xl flex flex-col items-center justify-between text-center border border-slate-700">
                    <div class="w-full">
                      <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest block">REAL SCANNING QR</span>
                      <span class="text-xs font-bold text-slate-100 block mt-1">바이어 검증 및 실시간 평가기준 QR</span>
                      <div class="my-3 p-3 bg-white rounded-2xl inline-block shadow-lg">
                        <canvas id="passport-qr-canvas" class="w-36 h-36"></canvas>
                      </div>
                      <div class="no-print mt-2">
                        <button onclick="openEvaluationModal('${certNumber}')" class="w-full py-2 px-3 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/50 text-emerald-300 font-extrabold text-xs cursor-pointer">
                          ${t('modal.qr_open_eval')}
                        </button>
                      </div>
                    </div>
                    <div class="w-full pt-3 mt-3 border-t border-slate-700/80 text-[10px] text-emerald-400 font-mono">
                      INCHEON PORT ESG AUTH · VERIFIED
                    </div>
                  </div>
                </div>

                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200 my-6">
                  <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                    <span class="text-xs font-bold text-slate-700 uppercase">핵심 안전 주행계통 정밀 정비 점검표</span>
                    <span class="text-[11px] font-bold text-emerald-700">전 항목 합격 (100% Pass)</span>
                  </div>
                  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 text-xs">
                    ${safetyItems.map(item => `
                      <div class="p-2.5 rounded-xl bg-white border border-slate-200 flex items-start justify-between">
                        <div>
                          <div class="font-bold text-slate-800 text-xs">${item.name}</div>
                          <div class="text-[11px] text-slate-500 mt-0.5">${item.result}</div>
                        </div>
                        <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">합격</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>

              <div class="no-print bg-slate-100 px-6 py-4 border-t border-slate-200 flex items-center justify-between">
                <p class="text-xs text-slate-500">${t('modal.footer_note')}</p>
                <button onclick="closePassportModal()" class="px-4 py-2 rounded-xl bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold text-xs cursor-pointer">${t('modal.close')}</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderEvaluationModal() {
        if (!state.showEvaluationModal) return '';
        return `
          <div class="fixed inset-0 z-[60] overflow-y-auto bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 fade-in">
            <div class="relative bg-white w-full max-w-4xl rounded-3xl shadow-2xl overflow-hidden border border-slate-200 my-6 max-h-[92vh] flex flex-col">
              <div class="bg-gradient-to-r from-emerald-800 to-slate-900 px-6 py-5 text-white flex items-center justify-between shrink-0">
                <div>
                  <span class="text-xs font-mono text-emerald-300">ID: ${state.evalCertNumber}</span>
                  <h2 class="text-lg sm:text-xl font-black text-white mt-0.5">ClearExport 디지털 그린 패스포트 실시간 검증 & 평가 기준표</h2>
                </div>
                <button onclick="closeEvaluationModal()" class="p-2 rounded-xl text-slate-300 hover:text-white hover:bg-white/10 cursor-pointer">
                  <i data-lucide="x" class="w-6 h-6"></i>
                </button>
              </div>

              <div class="overflow-y-auto p-6 sm:p-8 space-y-6 text-slate-800 text-xs">
                <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-between">
                  <div>
                    <h3 class="font-extrabold text-emerald-950 text-sm">공식 공인 인증 진위 확인 완료 (K-Registry Verified)</h3>
                    <p class="text-emerald-800 mt-0.5">본 차량의 환경 배출 데이터와 안전 이력은 인천항 수출인증센터 종합전산망에 정식 등록되어 있습니다.</p>
                  </div>
                  <span class="px-3 py-1 rounded-lg bg-emerald-600 text-white font-bold">VERIFIED</span>
                </div>

                <div class="overflow-x-auto rounded-2xl border border-slate-200">
                  <table class="w-full text-left">
                    <thead class="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                      <tr>
                        <th class="p-3.5">평가 항목</th>
                        <th class="p-3.5">공식 합격 판정 기준</th>
                        <th class="p-3.5">판정</th>
                        <th class="p-3.5">위반 시 위험 및 조치</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 bg-white">
                      <tr>
                        <td class="p-3.5 font-bold">매연 분진 (Smoke PM)</td>
                        <td class="p-3.5">최대 15.0% 이하</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">합격 (Pass)</span></td>
                        <td class="p-3.5 text-slate-600">초과 시 몽골·케냐 동절기 집중 단속 및 통관 보류</td>
                      </tr>
                      <tr>
                        <td class="p-3.5 font-bold">질소산화물 (NOx)</td>
                        <td class="p-3.5">0.40 g/km 이하 (EURO 5/6)</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">합격 (Pass)</span></td>
                        <td class="p-3.5 text-slate-600">초과 시 EAC 규제 불합격 반송</td>
                      </tr>
                      <tr>
                        <td class="p-3.5 font-bold">DPF 매연저감장치</td>
                        <td class="p-3.5">차압 0.05 bar 이하 유지</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">합격 (Pass)</span></td>
                        <td class="p-3.5 text-slate-600">DPF 탈거 차량은 칠레·케냐 반입 즉시 몰수</td>
                      </tr>
                      <tr>
                        <td class="p-3.5 font-bold">브레이크 제동력 편차</td>
                        <td class="p-3.5">좌우 제동 편차 8% 이내</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">합격 (Pass)</span></td>
                        <td class="p-3.5 text-slate-600">고온 사막 지대 급제동 화재 사고 예방</td>
                      </tr>
                      <tr>
                        <td class="p-3.5 font-bold">OBD-II 전자제어 진단</td>
                        <td class="p-3.5">DTC 에러코드 0건</td>
                        <td class="p-3.5"><span class="px-2 py-0.5 rounded font-bold bg-emerald-100 text-emerald-800">합격 (Pass)</span></td>
                        <td class="p-3.5 text-slate-600">센서 오작동으로 인한 불완전 연소 차단</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="bg-slate-100 px-6 py-4 border-t border-slate-200 flex justify-end">
                <button onclick="closeEvaluationModal()" class="px-5 py-2 rounded-xl bg-slate-900 text-white font-bold text-xs cursor-pointer">닫기</button>
              </div>
            </div>
          </div>
        `;
      }

      window.setLanguage = function(lang) { state.lang = lang; localStorage.setItem('clearexport_lang', lang); renderApp(); };
      window.toggleMobileMenu = function() { state.mobileMenuOpen = !state.mobileMenuOpen; renderApp(); };
      window.scrollToSection = function(id) {
        state.mobileMenuOpen = false; renderApp();
        setTimeout(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 50);
      };
      window.updateForm = function(field, value) { state[field] = value; renderApp(); };
      window.applyPreset = function(preset) {
        if (preset === 'cleanPorter') {
          state.yearRange = '2016_2020'; state.fuelType = 'diesel'; state.emissionGrade = 3;
          state.dpfStatus = 'installed_inspected'; state.targetCountryId = 'mongolia';
        } else if (preset === 'agedDiesel') {
          state.yearRange = '2010_before'; state.fuelType = 'diesel'; state.emissionGrade = 5;
          state.dpfStatus = 'stock_none'; state.targetCountryId = 'kenya_uganda';
        } else {
          state.yearRange = '2021_after'; state.fuelType = 'eco'; state.emissionGrade = 1;
          state.dpfStatus = 'installed_inspected'; state.targetCountryId = 'chile';
        }
        state.diagnosisResult = null; renderApp();
      };
      window.runDiagnosis = function() {
        state.diagnosisResult = evaluateCompliance({
          yearRange: state.yearRange, fuelType: state.fuelType, emissionGrade: state.emissionGrade,
          dpfStatus: state.dpfStatus, targetCountryId: state.targetCountryId
        });
        renderApp();
        setTimeout(() => { const el = document.getElementById('diagnosis-result-anchor'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 100);
      };
      window.setShowcaseCategory = function(cat) { state.activeCategory = cat; renderApp(); };
      window.setShowcaseCountry = function(countryId) { state.selectedCountryFilter = countryId; renderApp(); };
      window.setShowcaseSearch = function(val) { state.searchQuery = val; renderApp(); };
      window.resetShowcaseFilters = function() { state.activeCategory = 'all'; state.selectedCountryFilter = 'all'; state.searchQuery = ''; renderApp(); };
      window.openVehiclePassport = function(vehicleId) { state.virtualPreviewData = null; state.selectedVehicle = SAMPLE_VEHICLES.find(v => v.id === vehicleId) || null; renderApp(); };
      window.openVirtualPassport = function() {
        state.selectedVehicle = null;
        const country = TARGET_COUNTRIES.find(c => c.id === state.targetCountryId) || TARGET_COUNTRIES[0];
        state.virtualPreviewData = {
          certNumber: `CE-VIRTUAL-${new Date().getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`,
          specs: { yearRange: state.yearRange, fuelType: state.fuelType, emissionGrade: state.emissionGrade, dpfStatus: state.dpfStatus },
          country
        };
        renderApp();
      };
      window.closePassportModal = function() { state.selectedVehicle = null; state.virtualPreviewData = null; renderApp(); };
      window.openEvaluationModal = function(certNum) { state.evalCertNumber = certNum; state.showEvaluationModal = true; renderApp(); };
      window.closeEvaluationModal = function() { state.showEvaluationModal = false; renderApp(); };

      function generateQRCodeOnCanvas() {
        const canvas = document.getElementById('passport-qr-canvas');
        if (!canvas || typeof QRCode === 'undefined') return;
        const isVirtual = !!state.virtualPreviewData;
        const v = state.selectedVehicle;
        const vd = state.virtualPreviewData;
        const certNumber = isVirtual ? vd.certNumber : v.certNumber;
        const name = isVirtual ? `가상 시뮬레이션 (${vd.specs.fuelType})` : v.name;
        const text = `[ClearExport K-인증서 진위확인]\n인증번호: ${certNumber}\n차종: ${name}\n발급처: 인천항 수출인증센터\n*공식 검증 완료`;
        QRCode.toCanvas(canvas, text, { width: 144, margin: 1, color: { dark: '#0f172a', light: '#ffffff' } }, function(err) { if (err) console.error(err); });
      }

      function renderApp() {
        const app = document.getElementById('app');
        if (!app) return;
        app.innerHTML = `
          <div class="min-h-screen flex flex-col bg-slate-50 font-sans text-slate-800">
            ${renderNavbar()}
            <main class="flex-grow">
              ${renderHero()}
              ${renderComplianceChecker()}
              ${renderShowcase()}
            </main>
            ${renderSdgsFooter()}
            ${renderPassportModal()}
            ${renderEvaluationModal()}
          </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
        generateQRCodeOnCanvas();
      }

      document.addEventListener('DOMContentLoaded', renderApp);
    </script>
  </body>
</html>
